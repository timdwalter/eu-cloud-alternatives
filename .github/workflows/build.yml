# Builds both images and pushes them to the registry.
# IONOS: no OIDC federation for CI, so the pipeline logs in with a registry token (scopes pull + push,
# no delete, 7-day expiry) stored as the repository *secret* IONOS_REGISTRY_PASSWORD.
# The pipeline never talks to the cluster – deployment stays manual (infrastructure/scripts/deploy.sh).
#
# Repository *variables* – from `terraform output ci_variables`: REGISTRY, REGISTRY_USERNAME
name: build-images

on:
  # Automatic runs only on main; on the provider branch the pipeline is started by hand, so pushes that
  # touch this file do not trigger runs with missing credentials (lesson from the Scaleway test).
  push:
    branches: [main]
    paths: ["apps/backend/**", "apps/frontend/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Registry login (token, no OIDC available)
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.IONOS_REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push
        env:
          IMAGE: ${{ vars.REGISTRY }}/textlib-${{ matrix.service }}
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:$TAG" "apps/${{ matrix.service }}"
          docker push "$IMAGE:$TAG"
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
