# Builds both images and pushes them to the registry.
# Scaleway: no OIDC federation for GitHub, so an API key of an IAM application with
# ContainerRegistryFullAccess on the project only is stored as the repository *secret* SCW_SECRET_KEY.
# The pipeline never talks to the cluster – deployment stays manual (infrastructure/scripts/deploy.sh).
#
# Repository *variable* REGISTRY – from `terraform output ci_variables` (e.g. rg.fr-par.scw.cloud/<namespace>).
name: build-images

on:
  push:
    branches: [main, 004-scaleway]
    paths: ["apps/backend/**", "apps/frontend/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Registry login (API key, no OIDC available)
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: echo "$SCW_SECRET_KEY" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin
        shell: bash

      - name: Build and push
        env:
          IMAGE: ${{ vars.REGISTRY }}/textlib-${{ matrix.service }}
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:$TAG" "apps/${{ matrix.service }}"
          docker push "$IMAGE:$TAG"
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
