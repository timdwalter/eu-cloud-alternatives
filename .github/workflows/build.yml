# Builds both images and pushes them to the registry. No stored credentials: GitHub's OIDC token is
# exchanged for an Azure token of an identity that may only push images (AcrPush on one registry).
# The pipeline never talks to the cluster – deployment stays manual (scripts/deploy.sh).
#
# Repository *variables* (not secrets, they are not confidential) – from `terraform output ci_variables`:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, REGISTRY
name: build-images

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for azure/login
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure login (OIDC)
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The identity has no role on the subscription, only AcrPush on the registry
          allow-no-subscriptions: true

      - name: Registry login
        # Full login server name: avoids an ARM lookup the identity is not allowed to do
        run: az acr login --name "${{ vars.REGISTRY }}"

      - name: Build and push
        env:
          IMAGE: ${{ vars.REGISTRY }}/textlib-${{ matrix.service }}
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:$TAG" "app/${{ matrix.service }}"
          docker push "$IMAGE:$TAG"
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
