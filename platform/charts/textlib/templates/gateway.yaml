# One public entry point. cert-manager watches the annotation and creates the certificates for the
# HTTPS listeners; the HTTP listener serves the ACME challenge and redirects everything else.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gateway.name }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        {{- with .Values.gateway.serviceAnnotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        externalTrafficPolicy: Cluster
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.name }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.gateway.name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.issuer }}
spec:
  gatewayClassName: {{ .Values.gateway.name }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All # cert-manager creates its challenge route in this namespace, but keep it simple
    - name: https-app
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.domain | quote }}
      tls:
        certificateRefs:
          - name: app-tls
    - name: https-auth
      protocol: HTTPS
      port: 443
      hostname: {{ include "textlib.authHost" . | quote }}
      tls:
        certificateRefs:
          - name: auth-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: https-app
  hostnames:
    - {{ .Values.domain | quote }}
  rules:
    - backendRefs:
        - name: frontend
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: https-auth
  hostnames:
    - {{ include "textlib.authHost" . | quote }}
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
