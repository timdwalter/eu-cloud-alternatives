# Local run of the whole stack. Usage (from the repo root):
#   cp local/.env.example local/.env   # then replace every "change-me"
#   docker compose -f local/docker-compose.yml up --build
#   local/create-users.sh
#   open http://localhost:3000
# Image versions match platform/versions.env.
name: textlib

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d app"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Browser URL. Containers reach Keycloak via http://keycloak:8080 (backchannel), research.md R3.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Placeholders used in realm.json
      REALM_NAME: ${REALM_NAME}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      APP_URL: http://localhost:3000
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ../app/backend
    environment:
      DB_HOST: postgres
      DB_NAME: app
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      OIDC_ISSUER: http://localhost:8080/realms/${REALM_NAME}
      OIDC_JWKS_URL: http://keycloak:8080/realms/${REALM_NAME}/protocol/openid-connect/certs
      PORT: "8080"
    # No published port: the backend is internal only (research.md R2).
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../app/frontend
    environment:
      APP_NAME: ${APP_NAME}
      BACKEND_URL: http://backend:8080
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_KEYCLOAK_ID: ${CLIENT_ID}
      AUTH_KEYCLOAK_SECRET: ${CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/${REALM_NAME}
      AUTH_KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/${REALM_NAME}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - keycloak

volumes:
  pgdata:
