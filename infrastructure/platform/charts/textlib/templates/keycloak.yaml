apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  # Same file as the local Docker run; ${...} placeholders are filled by Keycloak from env vars.
  realm.json: |
    {{- .Files.Get "files/realm.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak }}
          args: ["start", "--import-realm"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://{{ .Values.db.host }}:5432/{{ .Values.db.keycloakDatabase }}?sslmode=require" }
            - { name: KC_DB_USERNAME, value: {{ .Values.db.user | quote }} }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: db-password } }
            # Public URL for browsers and tokens; pods may call http://keycloak:8080 (backchannel)
            - { name: KC_HOSTNAME, value: "https://{{ include "textlib.authHost" . }}" }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: {{ .Values.keycloakAdminUser | quote }} }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: kc-admin-password } }
            # Placeholders in realm.json
            - { name: REALM_NAME, value: {{ .Values.realm | quote }} }
            - { name: CLIENT_ID, value: {{ .Values.clientId | quote }} }
            - { name: APP_URL, value: "https://{{ .Values.domain }}" }
            - name: CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: client-secret } }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 10
            failureThreshold: 36 # up to 6 min on small nodes
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.keycloak | nindent 12 }}
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
